<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — Histórico del Hogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">

<div class="login-card">
  <div class="brand login-brand">
    <span class="brand-mark">⏻</span>
    <div>
      <div class="brand-title">Histórico</div>
      <div class="brand-sub">del hogar</div>
    </div>
  </div>

  <form id="login-form">
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required />
    </div>
    <p id="login-error" class="login-error" hidden></p>
    <button type="submit" class="btn-primary login-btn">Entrar</button>
  </form>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
